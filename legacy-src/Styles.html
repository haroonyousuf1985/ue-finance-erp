<style>
  /* ==========================================================================
     CAMPUS BUDGET & ACCOUNTING SYSTEM - STYLESHEET (Style.html)
     Theme: Slate Navy & Emerald Accent
     ========================================================================== */

  :root {
    --navy: #0F172A;
    --navy-light: #1E293B;
    --accent: #10B981;
    --accent-dark: #059669;
    --danger: #EF4444;
    --amber: #F59E0B;
    --bg: #0F172A;
    --border: #334155;
    --border-light: #475569;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Custom Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

  /* Sticky Top Navigation Header */
  header {
    background: #1E293B;
    border-bottom: 1px solid var(--border);
    color: #F8FAFC;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  header h1 {
    font-size: clamp(14px, 2.5vw, 18px);
    margin: 0;
    font-weight: 800;
    text-transform: uppercase;
    color: #FFFFFF;
    letter-spacing: -0.01em;
  }
  header .user-info { font-size: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  header button {
    background: #020617;
    border: 1px solid var(--border);
    color: #F8FAFC;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  header button:hover { background: #334155; color: var(--accent); border-color: var(--accent); }

  /* Centered Login Box */
  #loginScreen {
    max-width: 420px;
    margin: 8vh auto;
    background: #1E293B;
    border: 1px solid var(--border);
    padding: 32px 28px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  }
  #loginScreen h2 {
    margin-top: 0;
    color: #FFFFFF;
    font-weight: 800;
    font-size: 20px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 20px;
  }

  /* Form Layout & Field Styling */
  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 12px;
    margin-bottom: 6px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #020617;
    color: #F8FAFC;
    font-weight: 500;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  }
  select option { background: #1E293B; color: #F8FAFC; }

  /* Read-only "(auto)" fields - e.g. Budget Head Name, Employee Name/CNIC/IBAN
     fetched automatically. Visibly different from an editable field, but
     still readable in the dark theme (a plain light-gray background here,
     left over from an earlier light theme, produced white-on-white text). */
  input[readonly], input.readonly-field {
    background: #0B1220;
    color: var(--text-muted);
    cursor: default;
  }

  /* Buttons */
  button.primary {
    background: var(--accent);
    color: #000000;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    min-height: 44px;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
    transition: all 0.2s ease;
  }
  button.primary:hover { background: var(--accent-dark); transform: translateY(-1px); }
  button.primary:disabled { background: #064E3B; color: #6EE7B7; cursor: wait; opacity: 0.7; }

  button.secondary {
    background: #020617;
    border: 1px solid var(--border);
    color: #F8FAFC;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 44px;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  button.secondary:hover { background: #334155; border-color: var(--text-muted); }

  /* Status Messages */
  .error { color: #FCA5A5; font-size: 13px; margin-top: 8px; font-weight: 600; }
  .success { color: #6EE7B7; font-size: 13px; margin-top: 8px; font-weight: 600; }

  /* Tabs & Main Navigation Bar */
  /* NOTE: kept as display:none (not the reference's display:block) - the app
     screen must stay hidden until doLogin() reveals it, or the login gate
     breaks and the app is visible before anyone signs in. */
  #appScreen { display: none; }

  nav.tabs {
    display: flex;
    background: #1E293B;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: sticky;
    top: 52px;
    z-index: 40;
    padding: 0 12px;
  }
  nav.tabs button {
    background: none;
    border: none;
    padding: 14px 18px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    flex-shrink: 0;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  nav.tabs button.active { color: #10B981; border-bottom-color: #10B981; font-weight: 800; }
  nav.tabs button .badge {
    display: inline-block;
    background: var(--amber);
    color: #000000;
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10.5px;
    font-weight: 800;
    margin-left: 6px;
  }

  nav.subtabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  nav.subtabs button {
    background: #020617;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.2s ease;
  }
  nav.subtabs button.active { background: #10B981; color: #000000; border-color: #10B981; font-weight: 800; }

  /* Panels */
  .tabpanel { display: none; padding: 20px 16px; max-width: 1200px; margin: 0 auto; }
  .tabpanel.active { display: block; }

  .subpanel { display: none; }
  .subpanel.active { display: block; }

  /* Surface Cards */
  .card {
    background: #1E293B;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }
  .card h3 {
    margin-top: 0;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

  /* Flexible Form Grid Rows */
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .field { flex: 1; min-width: 160px; }
  @media (max-width: 640px) { .row { gap: 10px; } .row .field { min-width: 100%; } }

  /* Right-aligned numeric columns - applied to any <th>/<td class="num">
     across every report/table, and to the PDF exporter (see
     downloadTablePDF's columnAlign detection in Scripts.html), so amounts
     line up consistently everywhere instead of sitting left-aligned like
     ordinary text. */
  th.num, td.num { text-align: right; }

  /* Data Tables - compact by design: tight padding and no wrapping means
     every column shrinks to exactly its content's width (never wider),
     and rows take only the vertical space their content actually needs -
     so more data fits on screen without scrolling. */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; white-space: nowrap; }
  th {
    background: #020617;
    color: var(--text-muted);
    position: sticky;
    top: 0;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }
  td { color: #F8FAFC; }
  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.015); }
  tr:hover td { background: rgba(255, 255, 255, 0.04); }
  tfoot td { font-weight: 800; background: #020617; color: #10B981; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; border: 1px solid var(--border); }

  /* Sticky horizontal scrollbar - a slim bar pinned to the bottom of the
     viewport while a wide table is in view, so panning right never
     requires scrolling all the way back up to find the table's own
     scrollbar first (see initStickyScrollbars in Scripts.html). Purely an
     input proxy - it mirrors scrollLeft with whichever table is currently
     on screen, never duplicates content. */
  .sticky-hscroll {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 14px; overflow-x: scroll; overflow-y: hidden;
    z-index: 55; background: var(--navy-light); border-top: 1px solid var(--border);
    display: none;
  }
  .sticky-hscroll #stickyHScrollInner { height: 1px; }
  body.light .sticky-hscroll { background: #fff; border-top-color: #dbe1e6; }
  @media print { .sticky-hscroll { display: none !important; } }

  /* Balance KPI Dashboard Box */
  .balance-box { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  .balance-box div { flex: 1; min-width: 130px; padding: 14px; border-radius: 10px; text-align: center; border: 1px solid transparent; }
  .bal-allocated { background: rgba(59, 130, 246, 0.12); border-color: rgba(59, 130, 246, 0.3); color: #93C5FD; }
  .bal-spent { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #FCA5A5; }
  .bal-remaining { background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.3); color: #6EE7B7; }
  .balance-box .label { font-size: 11px; color: var(--text-muted); display: block; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-bottom: 4px; }
  .balance-box .val { font-size: 18px; font-weight: 800; }

  /* Status Badges & Pills */
  .pill { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; display: inline-block; text-transform: uppercase; letter-spacing: 0.03em; }
  .pill.Received { background: rgba(148, 163, 184, 0.15); color: #CBD5E1; border: 1px solid rgba(148, 163, 184, 0.3); }
  .pill.Processed { background: rgba(245, 158, 11, 0.15); color: #FCD34D; border: 1px solid rgba(245, 158, 11, 0.3); }
  .pill.Passed { background: rgba(59, 130, 246, 0.15); color: #93C5FD; border: 1px solid rgba(59, 130, 246, 0.3); }
  .pill.Paid { background: rgba(16, 185, 129, 0.15); color: #6EE7B7; border: 1px solid rgba(16, 185, 129, 0.3); }
  .pill.Cancelled { background: rgba(239, 68, 68, 0.15); color: #FCA5A5; border: 1px solid rgba(239, 68, 68, 0.3); text-decoration: line-through; }

  /* Vendor Autocomplete Suggestions */
  .vendor-suggestions {
    border: 1px solid var(--border);
    max-height: 180px;
    overflow-y: auto;
    background: #020617;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
  }
  .vendor-suggestions div { padding: 10px 12px; cursor: pointer; color: #F8FAFC; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  .vendor-suggestions div:hover { background: #1E293B; color: #10B981; }

  /* Multi-Select Checklist */
  .checklist { max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #020617; }
  .checklist label { display: flex; align-items: center; gap: 8px; font-weight: 500; margin-bottom: 6px; font-size: 13px; color: #F8FAFC; text-transform: none; }
  .checklist input { width: auto; accent-color: #10B981; }

  /* Progress Bar Meters */
  .progress-track { background: #020617; border: 1px solid var(--border); border-radius: 6px; height: 10px; overflow: hidden; min-width: 80px; }
  .progress-fill { height: 100%; background: var(--accent); }
  .progress-fill.over { background: var(--danger); }
  .progress-fill.high { background: var(--amber); }

  /* Toast Notification Banner */
  #toastWrap { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 420px; padding: 0 12px; }
  .toast { padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #FFFFFF; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); display: flex; align-items: center; gap: 10px; width: 100%; animation: slideUp .2s ease; }
  .toast.loading { background: #334155; color: #F8FAFC; border: 1px solid #475569; }
  .toast.success { background: #064E3B; color: #A7F3D0; border: 1px solid #059669; }
  .toast.error { background: #7F1D1D; color: #FECACA; border: 1px solid #DC2626; }

  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: #FFFFFF; border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Print Formatting Rules */
  @media print {
    header, nav.tabs, nav.subtabs, .no-print, #toastWrap { display: none !important; }
    body { background: #FFFFFF; color: #000000; }
    .tabpanel, .subpanel { display: none; }
    .tabpanel.active, .subpanel.active { display: block !important; }
  }
  /* Printing the Bill Audit View modal specifically - it lives outside any
     .tabpanel, so the rule above never shows it; this is its own override,
     toggled by printBillAudit() via body.printing-audit. */
  body.printing-audit > *:not(#billDetailModal) { display: none !important; }
  body.printing-audit #billDetailModal { display: flex !important; position: static !important; background: none !important; padding: 0 !important; }
  body.printing-audit #billDetailModal .card { max-height: none !important; overflow: visible !important; box-shadow: none !important; max-width: 100% !important; }

  /* New Entry form: fields were stretching to fill whatever row they
     happened to share (flex:1 divides ALL remaining row width evenly among
     however many fields are in THAT row), so the same kind of field came out
     a different width depending on which row it landed in. Fixed width here
     makes every box in this form the same size, consistently. */
  #tab-entry .row .field { flex: 0 1 230px; min-width: 200px; }
  #tab-entry .field-wide { flex: 1 1 100% !important; }
  @media (max-width: 640px) { #tab-entry .row .field { flex: 1 1 100%; } }

  /* Mobile Adjustments */
  @media (max-width: 480px) {
    .card { padding: 14px; }
    button.primary, button.secondary { width: 100%; margin-bottom: 6px; }
    header .user-info button { padding: 6px 8px; }
  }

  /* Sanction Proforma letter preview - always looks like a printed document
     (white paper, black text, serif type) regardless of the app's dark
     theme, since this is what actually gets exported to PDF/Word/print. */
  .sanction-doc {
    background: #FFFFFF;
    color: #000000;
    font-family: 'Times New Roman', Times, serif;
    padding: 40px 50px;
    line-height: 1.7;
    border-radius: 6px;
  }
  .sanction-doc * { color: #000000; }
  .sanction-doc table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .sanction-doc th, .sanction-doc td { border: 1px solid #000000; padding: 5px 7px; text-align: left; }
  .sanction-doc th { background: #EFEFEF; }

  /* Bill Audit View popup */
  .bav-caption { font-size: 12px; letter-spacing:.08em; text-transform:uppercase; color: var(--text-muted); font-weight:700; margin-bottom:2px; }
  .bav-billid { font-size: 20px; font-weight:800; color: #FFFFFF; margin-bottom: 14px; }
  .bav-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; margin-bottom: 18px; }
  .bav-item .bav-label { font-size: 11px; letter-spacing:.05em; text-transform:uppercase; color: var(--text-muted); font-weight:700; margin-bottom: 3px; }
  .bav-item .bav-value { font-size: 14px; font-weight:700; color: #F8FAFC; }
  .bav-value.status-Received { color: #CBD5E1; }
  .bav-value.status-Processed { color: #FCD34D; }
  .bav-value.status-Passed { color: #93C5FD; }
  .bav-value.status-Paid { color: #6EE7B7; }
  .bav-value.status-Cancelled { color: #FCA5A5; text-decoration: line-through; }
  .bav-section {
    background: rgba(16,185,129,0.10); border: 1px solid rgba(16,185,129,0.35); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 18px;
  }
  .bav-section .bav-section-title { color: var(--accent); font-weight:800; font-size: 12px; text-transform:uppercase; letter-spacing:.05em; margin-bottom: 6px; }
  .bav-section .bav-section-line { font-size: 13px; color: #F8FAFC; margin-top: 2px; }
  .bav-fin { border-top: 1px solid var(--border); }
  .bav-finrow { display:flex; justify-content:space-between; align-items:center; padding: 10px 2px; border-bottom: 1px solid var(--border); flex-wrap:nowrap; gap:10px; }
  .bav-finrow .bav-fin-value { flex-shrink:0; }
  .bav-finrow .bav-fin-label { color: var(--text-muted); font-size: 13px; }
  .bav-finrow .bav-fin-sub { color: var(--text-muted); font-size: 11px; }
  .bav-finrow .bav-fin-value { font-weight:700; font-size: 14px; color: #F8FAFC; white-space: nowrap; }
  /* Gross Amount and Net Amount Paid are the two figures people scan first -
     these must never wrap onto a second line, on screen or in the PDF/print
     export, regardless of how narrow the modal gets. */
  .bav-finrow.bav-gross .bav-fin-value, .bav-finrow.bav-net .bav-fin-value { white-space: nowrap; }
  .bav-finrow .bav-fin-value.negative { color: #FCA5A5; }
  .bav-finrow.bav-net { background: rgba(16,185,129,0.12); border-radius: 6px; border-bottom:none; margin-top: 4px; padding: 12px; }
  .bav-finrow.bav-net .bav-fin-label { color: #F8FAFC; font-weight:800; font-size: 13px; text-transform:uppercase; }
  .bav-finrow.bav-net .bav-fin-value { color: #6EE7B7; font-size: 18px; font-weight:800; }
  .bav-beneficiaries-table th, .bav-beneficiaries-table td { font-size: 12px; }

  /* ==========================================================================
     LIGHT MODE - toggled by adding class="light" to <body> (see toggleTheme()
     in Scripts.html), and now the default. Written as an additive override
     block rather than converting every dark-mode rule to a CSS variable, so
     the dark theme above is never touched or risked - this block only ever
     ADDS narrower, more specific rules that win when body.light is present.
     This is a faithful port of the project's original light theme (navy
     gradient header, soft off-white body, muted-but-legible secondary text)
     rather than a stark black-and-white treatment, which read as harsh.
     ========================================================================== */
  body.light {
    /* --navy-light is repurposed elsewhere (e.g. modal backgrounds in
       Index.html) as "the card/surface color" rather than its original
       meaning as the header gradient's second color - kept white here so
       modals stay a proper white card; the header gradient below uses the
       original navy tones directly instead of this variable. */
    --navy-light: #FFFFFF;
    --accent: #2f8f6a;
    --accent-dark: #267a5a;
    --danger: #c0392b;
    --amber: #b8860b;
    --bg: #f4f6f8;
    --border: #dbe1e6;
    --border-light: #c3ccd3;
    --text: #222222;
    --text-muted: #666666;
    background: #f4f6f8;
    color: #222222;
  }
  body.light ::-webkit-scrollbar-track { background: #f4f6f8; }
  body.light ::-webkit-scrollbar-thumb { background: #c3ccd3; }
  body.light ::-webkit-scrollbar-thumb:hover { background: #9aa7b0; }

  body.light header { background: linear-gradient(135deg,#1c3d5a,#2a5578); border-bottom: none; box-shadow: none; color: #fff; }
  body.light header h1 { color: #fff; }
  body.light header .user-info { color: #fff; }
  body.light header button { background: #ffffff1a; border: 1px solid #ffffff40; color: #fff; }
  body.light header button:hover { background: #ffffff30; color: #fff; border-color: #ffffff40; }
  body.light .theme-toggle-btn { background: #ffffff1a; }

  body.light #loginScreen { background: #fff; border: none; box-shadow: 0 4px 24px rgba(0,0,0,0.13); }
  body.light #loginScreen h2 { color: #1c3d5a; border-bottom: none; }

  body.light label { color: #444444; font-weight: 600; }
  body.light input, body.light select, body.light textarea {
    background: #fff; border: 1px solid #dbe1e6; color: #222222;
  }
  body.light select option { background: #fff; color: #222222; }
  body.light input[readonly], body.light input.readonly-field { background: #f4f6f8; color: #666666; }
  body.light input::placeholder, body.light textarea::placeholder { color: #8a95a0; }

  body.light button.primary { color: #fff; box-shadow: none; }
  body.light button.primary:disabled { background: #9ddbc0; color: #fff; }
  body.light button.secondary { background: #fff; border: 1px solid #dbe1e6; color: #222222; }
  body.light button.secondary:hover { background: #f0f2f4; border-color: #c3ccd3; }

  body.light nav.tabs { background: #fff; border-bottom: 1px solid #dbe1e6; }
  body.light nav.tabs button { color: #555555; }
  body.light nav.tabs button.active { color: #1c3d5a; border-bottom-color: #2f8f6a; }
  body.light nav.subtabs button { background: #eef1f4; border: none; color: #222222; }
  body.light nav.subtabs button.active { background: #1c3d5a; color: #fff; border-color: #1c3d5a; }
